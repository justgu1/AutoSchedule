services:
  backend:
    volumes:
      - ./backend:/var/www/html
      - ./infra/docker/backend/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      - backend_tmp:/var/www/html/storage/tmp

  frontend:
    image: node:22-alpine
    container_name: autoschedule-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # prefixo VITE_ pra expor a variável no bundle do browser
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks:
      - autoschedule
