services:
  # Worker e scheduler rodam o mesmo código do backend em processo próprio: sem o mesmo mount
  # eles seguem servindo a imagem construída, e um job novo falha com o enum velho em memória.
  backend:
    volumes: &dev-backend-volumes
      - ./backend:/var/www/html
      - ./infra/docker/backend/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      - backend_tmp:/var/www/html/storage/tmp

  worker:
    volumes: *dev-backend-volumes

  scheduler:
    volumes: *dev-backend-volumes

  frontend:
    image: node:22-alpine
    container_name: autoschedule-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # prefixo VITE_ pra expor a variável no bundle do browser
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks:
      - autoschedule
