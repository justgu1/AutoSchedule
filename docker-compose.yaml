services:
  nginx:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: autoschedule-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - autoschedule

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: autoschedule-backend
    environment: &backend-env
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}

      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-autoschedule}
      DB_USERNAME: ${DB_USERNAME:-pgsql}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_APP_USERNAME: ${DB_APP_USERNAME:-autoschedule_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-changeme}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RATE_LIMIT_GENERAL_MAX: ${RATE_LIMIT_GENERAL_MAX:-1000}
      RATE_LIMIT_GENERAL_WINDOW: ${RATE_LIMIT_GENERAL_WINDOW:-60}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-5}
      RATE_LIMIT_AUTH_WINDOW: ${RATE_LIMIT_AUTH_WINDOW:-60}

      PAGINATION_DEFAULT_PER_PAGE: ${PAGINATION_DEFAULT_PER_PAGE:-20}
      PAGINATION_MAX_PER_PAGE: ${PAGINATION_MAX_PER_PAGE:-100}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@autoschedule.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-autoschedule}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password}
      # URL pública dos objetos -- diferente de S3_ENDPOINT porque o browser
      # acessa pela porta mapeada no host (MINIO_API_PORT), não pela porta
      # interna do container (9000) que S3_ENDPOINT usa.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/autoschedule}

      TEMP_STORAGE_PATH: /var/www/html/storage/tmp

    volumes: &backend-volumes # Prefiro que tenhamos um backup dos uploads até o retorno 200 do s3.
      - backend_tmp:/var/www/html/storage/tmp

    depends_on: &backend-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

    networks:
      - autoschedule

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: autoschedule-worker
    command: php bin/worker.php
    environment: *backend-env
    volumes: *backend-volumes
    depends_on: *backend-depends-on
    networks:
      - autoschedule

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: autoschedule-scheduler
    command: php bin/scheduler.php
    environment: *backend-env
    volumes: *backend-volumes
    depends_on: *backend-depends-on
    networks:
      - autoschedule

  postgres:
    image: postgres:17-alpine
    container_name: autoschedule-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-autoschedule}
      POSTGRES_USER: ${DB_USERNAME:-pgsql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-pgsql} -d ${DB_DATABASE:-autoschedule}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - autoschedule

  redis:
    image: redis:8-alpine
    container_name: autoschedule-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - autoschedule

  minio:
    image: minio/minio:latest
    container_name: autoschedule-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - autoschedule

  mailpit:
    image: axllent/mailpit:latest
    container_name: autoschedule-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - autoschedule

  # profile próprio -- nunca sobe com `docker compose up`, só com
  # `docker compose run` (via `make load-test`).
  k6:
    image: grafana/k6:latest
    container_name: autoschedule-k6
    profiles: ["load-test"]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./backend/load-tests:/scripts:ro
    depends_on:
      - nginx
    networks:
      - autoschedule

  # E2E (Playwright) -- mesmo padrão do k6: profile próprio, nunca sobe com
  # `docker compose up`, só via `make e2e`. Roda contra o nginx (build real),
  # não o dev server -- é o que representa produção.
  # Sem `command:` fixo -- `make e2e-setup`/`make e2e` decidem o quê rodar
  # (npm ci, depois playwright test) via `docker compose run --rm e2e <comando>`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: autoschedule-e2e
    profiles: ["e2e"]
    working_dir: /app
    environment:
      BASE_URL: http://nginx
      MAILPIT_URL: http://mailpit:8025
      CI: "true"
    volumes:
      - ./frontend:/app
    depends_on:
      - nginx
      - mailpit
    networks:
      - autoschedule

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_tmp:

networks:
  autoschedule:
    driver: bridge