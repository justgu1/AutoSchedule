; Sobrescreve o pool `www` default da imagem (pm.max_children=5) -- pouco pra
; várias chamadas concorrentes por página (vehicles+facets+me+dealership) sob
; carga de E2E/load-test, fila no FPM sem ser bug de app nem de teste.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 10
