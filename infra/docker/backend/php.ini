; Upload de foto de concessionária vai até 20MB (ver DealershipController::MAX_PHOTO_BYTES) --
; post_max_size folga sobre o limite pro resto do multipart (campos de texto, boundary).
upload_max_filesize=20M
post_max_size=24M
; GD decodifica o bitmap inteiro na memória antes de redimensionar/reencodar -- folga sobre o
; padrão (128M) pra caber uma imagem grande sem estourar.
memory_limit=256M
