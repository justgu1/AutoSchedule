apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoschedule-backend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoschedule-backend
  template:
    metadata:
      labels:
        app: autoschedule-backend
    spec:
      # Migrations/seeders rodam toda subida -- idempotentes (migrations rastreiam o
      # que já foi aplicado, seeders usam ON CONFLICT DO NOTHING), então travam o
      # container principal até o banco estar num estado consistente, sem duplicar nada.
      initContainers:
        - name: migrate
          image: ghcr.io/justgu1/autoschedule-backend:latest
          command: ['sh', '-c', 'php bin/migrate.php && php bin/seed.php']
          env: &backend-env
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: 'false'
            - name: APP_TIMEZONE
              value: America/Sao_Paulo

            - name: DB_DRIVER
              value: pgsql
            - name: DB_HOST
              value: postgresql.shared.svc.cluster.local
            - name: DB_PORT
              value: '5432'
            - name: DB_DATABASE
              value: autoschedule
            - name: DB_USERNAME
              value: autoschedule
            - name: DB_APP_USERNAME
              value: autoschedule_app
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: DB_PASSWORD } }
            - name: DB_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: DB_APP_PASSWORD } }

            - name: REDIS_HOST
              value: redis-master.shared.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PREFIX
              value: autoschedule_
            - name: REDIS_USERNAME
              value: autoschedule
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: REDIS_PASSWORD } }

            - name: CORS_ALLOWED_ORIGINS
              value: https://autoschedule.justgui.dev
            - name: SECURITY_HSTS_ENABLED
              value: 'true'
            - name: COOKIE_SECURE
              value: 'true'

            - name: MAIL_FROM
              value: support@justgui.dev
            - name: FRONTEND_URL
              value: https://autoschedule.justgui.dev
            - name: MAIL_DSN
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: MAIL_DSN } }

            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: GOOGLE_CLIENT_ID } }

            - name: S3_ENDPOINT
              value: http://minio.shared.svc.cluster.local:9000
            - name: S3_BUCKET
              value: autoschedule
            - name: S3_REGION
              value: us-east-1
            - name: S3_PUBLIC_URL
              value: https://autoschedule.justgui.dev/cdn/autoschedule
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: autoschedule-secrets, key: S3_SECRET_KEY } }
            - name: TEMP_STORAGE_PATH
              value: /var/www/html/storage/tmp
          volumeMounts: &backend-volume-mounts
            - name: jwt-keys
              mountPath: /var/www/html/storage/keys
              readOnly: true
      containers:
        - name: backend
          image: ghcr.io/justgu1/autoschedule-backend:latest
          ports:
            - name: fastcgi
              containerPort: 9000
          env: *backend-env
          volumeMounts: *backend-volume-mounts
          readinessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 15
      volumes:
        - name: jwt-keys
          secret:
            secretName: autoschedule-secrets
            items:
              - key: oauth-private.pem
                path: oauth-private.pem
              - key: oauth-public.pem
                path: oauth-public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: autoschedule-backend
  namespace: apps
spec:
  selector:
    app: autoschedule-backend
  ports:
    - name: fastcgi
      port: 9000
      targetPort: fastcgi
