<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Confirme seu teste-drive</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px;">
                    <tr>
                        <td>
                            <h1 style="font-size:20px;color:#111827;margin:0 0 16px;">AutoSchedule</h1>
                            <p style="font-size:15px;color:#374151;line-height:1.5;margin:0 0 24px;">
                                Olá, {{CUSTOMER_NAME}}. O veículo está disponível pro seu teste-drive
                                agendado para {{SCHEDULED_AT}}. Confirme ou cancele clicando abaixo.
                            </p>
                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="border-radius:6px;background:#111827;">
                                        <a href="{{MANAGE_LINK}}" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-size:14px;">
                                            Confirmar ou cancelar
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
